name: Faturamento diário

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  gerar-boletos:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de faturamento
        run: |
          curl -sf -X POST "${{ vars.APP_URL }}/api/cron/faturamento" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
